<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Historial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #E8F4F5 !important; }
    .bg-ips { background-color: #50B9C0 !important; }
    .btn-ips { background-color: #50B9C0; border-color: #50B9C0; color: white; }
    .btn-ips:hover { background-color: #3da8af; border-color: #3da8af; color: white; }
    .table-sm td, .table-sm th { padding: 0.4rem; font-size: 0.9rem; }
    .card { background-color: #ffffff; }
    .fila-supervivencia { background-color: #fff8e1 !important; }
    .fila-cobro { background-color: #ffffff !important; }
  </style>
</head>
<body>
  
  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1 text-white text-decoration-none">Volver al Panel</a>
      <span class="text-white" id="total-registros"></span>
    </div>
  </nav>

  <div class="container-fluid px-4">

    <!-- Filtros y Exportar -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        
        <!-- Tipo de registro -->
        <div class="row g-2 mb-3">
          <div class="col-12">
            <label class="form-label small mb-1"><strong>Tipo de registro</strong></label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="tipo" id="tipo_todos" value="todos" checked onchange="aplicarFiltros()">
              <label class="btn btn-outline-secondary" for="tipo_todos">Todos</label>
              
              <input type="radio" class="btn-check" name="tipo" id="tipo_sueldos" value="sueldos" onchange="aplicarFiltros()">
              <label class="btn btn-outline-primary" for="tipo_sueldos">Solo Sueldos</label>
              
              <input type="radio" class="btn-check" name="tipo" id="tipo_supervivencia" value="supervivencia" onchange="aplicarFiltros()">
              <label class="btn btn-outline-warning" for="tipo_supervivencia">Solo Supervivencia</label>
            </div>
          </div>
        </div>

        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small mb-1">Ano</label>
            <select id="filtro-anio" class="form-select" onchange="aplicarFiltros()">
              <option value="">Todos los anos</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small mb-1">Banco</label>
            <select id="filtro-banco" class="form-select" onchange="aplicarFiltros()">
              <option value="">Todos los bancos</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small mb-1">Buscar</label>
            <input type="text" id="filtro-busqueda" class="form-control" placeholder="Buscar..." oninput="aplicarFiltros()">
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" onclick="limpiarFiltros()">Limpiar</button>
          </div>
        </div>

        <hr>

        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-success" onclick="exportarCSV()">Exportar a CSV</button>
          <button class="btn btn-info text-white" onclick="exportarJSON()">Exportar a JSON</button>
        </div>
      </div>
    </div>

    <!-- Tabla de Historial -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover table-sm mb-0">
            <thead class="table-dark">
              <tr>
                <th>Tipo</th>
                <th>Fecha</th>
                <th>Pesos</th>
                <th>Euros</th>
                <th>Cotizacion</th>
                <th>Banco</th>
                <th>Obs</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-historial">
              <tr><td colspan="8" class="text-center">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let todosLosDatos = [];
    let datosFiltrados = [];

    document.addEventListener('DOMContentLoaded', async () => {
      let intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          document.getElementById('tabla-historial').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error: No se pudo conectar.</td></tr>';
          return;
        }
      }

      const session = await verificarSesion();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      await cargarTodosLosDatos();
    });

    async function cargarTodosLosDatos() {
      try {
        const { data, error } = await window.db
          .from('cobros')
          .select('*')
          .order('recibo_vision_fecha', { ascending: false });

        if (error) throw error;

        todosLosDatos = data || [];
        document.getElementById('total-registros').innerText = `Total: ${todosLosDatos.length} registros`;

        // Llenar filtro de anos
        const anios = [...new Set(todosLosDatos.map(c => c.recibo_vision_fecha ? c.recibo_vision_fecha.substring(0, 4) : ''))].filter(a => a).sort().reverse();
        const selAnio = document.getElementById('filtro-anio');
        anios.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          selAnio.appendChild(opt);
        });

        // Llenar filtro de bancos
        const bancos = [...new Set(todosLosDatos.map(c => c.banco_detalle).filter(b => b))].sort();
        const selBanco = document.getElementById('filtro-banco');
        bancos.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b;
          opt.textContent = b;
          selBanco.appendChild(opt);
        });

        aplicarFiltros();

      } catch (error) {
        document.getElementById('tabla-historial').innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error: ${error.message}</td></tr>`;
      }
    }

    function aplicarFiltros() {
      const tipo = document.querySelector('input[name="tipo"]:checked').value;
      const anio = document.getElementById('filtro-anio').value;
      const banco = document.getElementById('filtro-banco').value;
      const busqueda = document.getElementById('filtro-busqueda').value.toLowerCase().trim();

      datosFiltrados = todosLosDatos.filter(c => {
        // Filtro tipo
        const esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        
        if (tipo === 'sueldos' && esSupervivencia) return false;
        if (tipo === 'supervivencia' && !esSupervivencia) return false;
        
        // Filtro ano
        if (anio && (!c.recibo_vision_fecha || !c.recibo_vision_fecha.startsWith(anio))) return false;
        
        // Filtro banco
        if (banco && c.banco_detalle !== banco) return false;
        
        // Filtro busqueda
        if (busqueda) {
          const texto = `${c.obs || ''} ${c.monto_pesos || ''} ${c.monto_euros || ''} ${c.banco_detalle || ''}`.toLowerCase();
          if (!texto.includes(busqueda)) return false;
        }
        
        return true;
      });

      renderizarTabla();
    }

    function renderizarTabla() {
      const tbody = document.getElementById('tabla-historial');

      if (datosFiltrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No hay resultados con esos filtros.</td></tr>';
        return;
      }

      let html = '';
      datosFiltrados.forEach(c => {
        const esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        const claseFila = esSupervivencia ? 'fila-supervivencia' : 'fila-cobro';
        const tipoBadge = esSupervivencia 
          ? '<span class="badge bg-warning text-dark">Supervivencia</span>' 
          : '<span class="badge bg-primary">Sueldo</span>';

        // Si es supervivencia, mostrar fechas de envio/recepcion
        let fechaMostrar = c.recibo_vision_fecha || '-';
        if (esSupervivencia && c.supervivencia_enviada) {
          fechaMostrar = c.supervivencia_enviada;
        }

        html += `
          <tr class="${claseFila}">
            <td>${tipoBadge}</td>
            <td>${fechaMostrar}</td>
            <td>${esSupervivencia ? '-' : (c.monto_pesos ? '$' + parseFloat(c.monto_pesos).toLocaleString('es-AR') : '-')}</td>
            <td>${esSupervivencia ? '-' : (c.monto_euros ? 'EUR ' + parseFloat(c.monto_euros).toLocaleString('es-ES') : '-')}</td>
            <td>${esSupervivencia ? '-' : (c.cotizacion_banco_euro || '-')}</td>
            <td><small>${c.banco_detalle || '-'}</small></td>
            <td><small>${c.obs || ''}</small></td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-danger" onclick="eliminarRegistro(${c.id})" title="Eliminar">X</button>
            </td>
          </tr>`;
      });
      tbody.innerHTML = html;
    }

    function limpiarFiltros() {
      document.getElementById('tipo_todos').checked = true;
      document.getElementById('filtro-anio').value = '';
      document.getElementById('filtro-banco').value = '';
      document.getElementById('filtro-busqueda').value = '';
      aplicarFiltros();
    }

    async function eliminarRegistro(id) {
      if (!confirm('Estas seguro de que quieres eliminar este registro? Esta accion no se puede deshacer.')) return;

      const { error } = await window.db.from('cobros').delete().eq('id', id);

      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        todosLosDatos = todosLosDatos.filter(c => c.id !== id);
        document.getElementById('total-registros').innerText = `Total: ${todosLosDatos.length} registros`;
        aplicarFiltros();
      }
    }

    function exportarCSV() {
      if (datosFiltrados.length === 0) { alert('No hay datos para exportar.'); return; }

      const headers = ['tipo', 'recibo_vision_fecha', 'recibo_fecha_pago_arg', 'monto_pesos', 'transferencia_fecha', 'monto_euros', 'cotizacion_banco_euro', 'banco_detalle', 'obs', 'supervivencia_enviada', 'supervivencia_recibida'];
      
      let csv = headers.join(',') + '\n';
      
      datosFiltrados.forEach(c => {
        const esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        const fila = [
          esSupervivencia ? 'Supervivencia' : 'Sueldo',
          c.recibo_vision_fecha || '',
          c.recibo_fecha_pago_arg || '',
          c.monto_pesos || '',
          c.transferencia_fecha || '',
          c.monto_euros || '',
          c.cotizacion_banco_euro || '',
          c.banco_detalle || '',
          c.obs || '',
          c.supervivencia_enviada || '',
          c.supervivencia_recibida || ''
        ].map(v => {
          const valor = String(v);
          if (valor.includes(',') || valor.includes('"') || valor.includes('\n')) {
            return '"' + valor.replace(/"/g, '""') + '"';
          }
          return valor;
        });
        csv += fila.join(',') + '\n';
      });

      descargarArchivo(csv, `IPS_Historial_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;');
    }

    function exportarJSON() {
      if (datosFiltrados.length === 0) { alert('No hay datos para exportar.'); return; }
      const json = JSON.stringify(datosFiltrados, null, 2);
      descargarArchivo(json, `IPS_Historial_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
    }

    function descargarArchivo(contenido, nombre, tipo) {
      const blob = new Blob([contenido], { type: tipo });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
