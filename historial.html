<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Historial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #E8F4F5 !important; }
    .bg-ips { background-color: #50B9C0 !important; }
    .btn-ips { background-color: #50B9C0; border-color: #50B9C0; color: white; }
    .btn-ips:hover { background-color: #3da8af; border-color: #3da8af; color: white; }
    .table-sm td, .table-sm th { padding: 0.4rem; font-size: 0.85rem; vertical-align: middle; }
    .card { background-color: #ffffff; }
    .fila-supervivencia { background-color: #fff8e1 !important; }
    .fila-cobro { background-color: #ffffff !important; }
    .edit-input { font-size: 0.8rem; padding: 0.25rem 0.4rem; }
  </style>
</head>
<body>
  
  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1 text-white text-decoration-none">Volver al Panel</a>
      <span class="text-white" id="total-registros"></span>
    </div>
  </nav>

  <div class="container-fluid px-4">

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-12">
            <label class="form-label small mb-1"><strong>Tipo de registro</strong></label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="tipo" id="tipo_todos" value="todos" checked onchange="aplicarFiltros()">
              <label class="btn btn-outline-secondary" for="tipo_todos">Todos</label>
              
              <input type="radio" class="btn-check" name="tipo" id="tipo_sueldos" value="sueldos" onchange="aplicarFiltros()">
              <label class="btn btn-outline-primary" for="tipo_sueldos">Solo Sueldos</label>
              
              <input type="radio" class="btn-check" name="tipo" id="tipo_supervivencia" value="supervivencia" onchange="aplicarFiltros()">
              <label class="btn btn-outline-warning" for="tipo_supervivencia">Solo Supervivencia</label>
            </div>
          </div>
        </div>

        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small mb-1">Ano</label>
            <select id="filtro-anio" class="form-select" onchange="aplicarFiltros()">
              <option value="">Todos los anos</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small mb-1">Banco</label>
            <select id="filtro-banco" class="form-select" onchange="aplicarFiltros()">
              <option value="">Todos los bancos</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small mb-1">Buscar</label>
            <input type="text" id="filtro-busqueda" class="form-control" placeholder="Buscar..." oninput="aplicarFiltros()">
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" onclick="limpiarFiltros()">Limpiar</button>
          </div>
        </div>

        <hr>

        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-success" onclick="exportarCSV()">Exportar a CSV</button>
          <button class="btn btn-info text-white" onclick="exportarJSON()">Exportar a JSON</button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover table-sm mb-0">
            <thead class="table-dark">
              <tr>
                <th>Tipo</th>
                <th>Fecha</th>
                <th>Pesos</th>
                <th>Euros</th>
                <th>Cotizacion</th>
                <th>Banco</th>
                <th>Obs</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-historial">
              <tr><td colspan="8" class="text-center">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    var todosLosDatos = [];
    var datosFiltrados = [];

    document.addEventListener('DOMContentLoaded', async () => {
      var intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          document.getElementById('tabla-historial').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error: No se pudo conectar.</td></tr>';
          return;
        }
      }

      var session = await verificarSesion();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      await cargarTodosLosDatos();
    });

    async function cargarTodosLosDatos() {
      try {
        var result = await window.db
          .from('cobros')
          .select('*')
          .order('recibo_vision_fecha', { ascending: false });

        if (result.error) throw result.error;

        todosLosDatos = result.data || [];
        document.getElementById('total-registros').innerText = 'Total: ' + todosLosDatos.length + ' registros';

        // Llenar filtro de anos
        var anios = [];
        todosLosDatos.forEach(c => {
          if (c.recibo_vision_fecha) {
            var anio = c.recibo_vision_fecha.substring(0, 4);
            if (anios.indexOf(anio) === -1) anios.push(anio);
          }
        });
        anios.sort().reverse();
        var selAnio = document.getElementById('filtro-anio');
        anios.forEach(a => {
          var opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          selAnio.appendChild(opt);
        });

        // Llenar filtro de bancos
        var bancos = [];
        todosLosDatos.forEach(c => {
          if (c.banco_detalle && bancos.indexOf(c.banco_detalle) === -1) {
            bancos.push(c.banco_detalle);
          }
        });
        bancos.sort();
        var selBanco = document.getElementById('filtro-banco');
        bancos.forEach(b => {
          var opt = document.createElement('option');
          opt.value = b;
          opt.textContent = b;
          selBanco.appendChild(opt);
        });

        aplicarFiltros();

      } catch (error) {
        document.getElementById('tabla-historial').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error: ' + error.message + '</td></tr>';
      }
    }

    function aplicarFiltros() {
      var tipo = document.querySelector('input[name="tipo"]:checked').value;
      var anio = document.getElementById('filtro-anio').value;
      var banco = document.getElementById('filtro-banco').value;
      var busqueda = document.getElementById('filtro-busqueda').value.toLowerCase().trim();

      datosFiltrados = todosLosDatos.filter(c => {
        var esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        
        if (tipo === 'sueldos' && esSupervivencia) return false;
        if (tipo === 'supervivencia' && !esSupervivencia) return false;
        
        if (anio && (!c.recibo_vision_fecha || !c.recibo_vision_fecha.startsWith(anio))) return false;
        if (banco && c.banco_detalle !== banco) return false;
        
        if (busqueda) {
          var texto = ((c.obs || '') + ' ' + (c.monto_pesos || '') + ' ' + (c.monto_euros || '') + ' ' + (c.banco_detalle || '')).toLowerCase();
          if (texto.indexOf(busqueda) === -1) return false;
        }
        
        return true;
      });

      renderizarTabla();
    }

    function renderizarTabla() {
      var tbody = document.getElementById('tabla-historial');

      if (datosFiltrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No hay resultados con esos filtros.</td></tr>';
        return;
      }

      var html = '';
      datosFiltrados.forEach(c => {
        var esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        var claseFila = esSupervivencia ? 'fila-supervivencia' : 'fila-cobro';
        var tipoBadge = esSupervivencia 
          ? '<span class="badge bg-warning text-dark">Supervivencia</span>' 
          : '<span class="badge bg-primary">Sueldo</span>';

        var fechaMostrar = c.recibo_vision_fecha || '-';
        if (esSupervivencia && c.supervivencia_enviada) {
          fechaMostrar = c.supervivencia_enviada;
        }

        html += '<tr id="fila-' + c.id + '" class="' + claseFila + '">';
        html += '<td>' + tipoBadge + '</td>';
        html += '<td>' + fechaMostrar + '</td>';
        html += '<td>' + (esSupervivencia ? '-' : (c.monto_pesos ? '$' + parseFloat(c.monto_pesos).toLocaleString('es-AR') : '-')) + '</td>';
        html += '<td>' + (esSupervivencia ? '-' : (c.monto_euros ? 'EUR ' + parseFloat(c.monto_euros).toLocaleString('es-ES') : '-')) + '</td>';
        html += '<td>' + (esSupervivencia ? '-' : (c.cotizacion_banco_euro || '-')) + '</td>';
        html += '<td><small>' + (c.banco_detalle || '-') + '</small></td>';
        html += '<td><small>' + (c.obs || '') + '</small></td>';
        html += '<td class="text-center">';
        html += '<button class="btn btn-sm btn-outline-primary me-1" onclick="editarFila(' + c.id + ')" title="Editar">E</button>';
        html += '<button class="btn btn-sm btn-outline-danger" onclick="eliminarRegistro(' + c.id + ')" title="Eliminar">X</button>';
        html += '</td>';
        html += '</tr>';
      });
      tbody.innerHTML = html;
    }

    function limpiarFiltros() {
      document.getElementById('tipo_todos').checked = true;
      document.getElementById('filtro-anio').value = '';
      document.getElementById('filtro-banco').value = '';
      document.getElementById('filtro-busqueda').value = '';
      aplicarFiltros();
    }

    // ===== FUNCIONES DE EDICION EN LINEA =====
    function editarFila(id) {
      var cobro = null;
      for (var i = 0; i < todosLosDatos.length; i++) {
        if (todosLosDatos[i].id === id) { cobro = todosLosDatos[i]; break; }
      }
      if (!cobro) return;

      var esSupervivencia = cobro.banco_detalle && cobro.banco_detalle.toLowerCase().includes('supervivencia');
      var fila = document.getElementById('fila-' + id);
      if (!fila) return;

      var html = '';
      html += '<td>';
      html += '<select id="edit-tipo-' + id + '" class="form-select form-select-sm edit-input">';
      html += '<option value="Sueldo"' + (!esSupervivencia ? ' selected' : '') + '>Sueldo</option>';
      html += '<option value="Supervivencia"' + (esSupervivencia ? ' selected' : '') + '>Supervivencia</option>';
      html += '</select>';
      html += '</td>';

      html += '<td><input type="date" id="edit-fecha-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.recibo_vision_fecha || '') + '"></td>';

      html += '<td><input type="number" step="0.01" id="edit-pesos-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.monto_pesos || '') + '"' + (esSupervivencia ? ' disabled' : '') + '></td>';

      html += '<td><input type="number" step="0.01" id="edit-euros-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.monto_euros || '') + '"' + (esSupervivencia ? ' disabled' : '') + '></td>';

      html += '<td><input type="number" step="0.01" id="edit-cotizacion-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.cotizacion_banco_euro || '') + '"' + (esSupervivencia ? ' disabled' : '') + '></td>';

      html += '<td><input type="text" id="edit-banco-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.banco_detalle || '') + '"></td>';

      html += '<td><input type="text" id="edit-obs-' + id + '" class="form-control form-control-sm edit-input" value="' + (cobro.obs || '') + '"></td>';

      html += '<td class="text-center">';
      html += '<button class="btn btn-sm btn-success me-1" onclick="guardarEdicion(' + id + ')" title="Guardar">OK</button>';
      html += '<button class="btn btn-sm btn-secondary" onclick="cancelarEdicion()" title="Cancelar">X</button>';
      html += '</td>';

      fila.innerHTML = html;
    }

    async function guardarEdicion(id) {
      var tipo = document.getElementById('edit-tipo-' + id).value;
      var fecha = document.getElementById('edit-fecha-' + id).value;
      var pesos = document.getElementById('edit-pesos-' + id).value;
      var euros = document.getElementById('edit-euros-' + id).value;
      var cotizacion = document.getElementById('edit-cotizacion-' + id).value;
      var banco = document.getElementById('edit-banco-' + id).value;
      var obs = document.getElementById('edit-obs-' + id).value;

      var esSupervivencia = tipo === 'Supervivencia';
      var bancoFinal = esSupervivencia ? 'Tramite Supervivencia' : banco;

      var updates = {
        recibo_vision_fecha: fecha || null,
        monto_pesos: esSupervivencia ? 0 : parseFloat(pesos) || 0,
        monto_euros: esSupervivencia ? 0 : parseFloat(euros) || 0,
        cotizacion_banco_euro: esSupervivencia ? null : (parseFloat(cotizacion) || null),
        banco_detalle: bancoFinal,
        obs: obs || null
      };

      if (esSupervivencia) {
        updates.supervivencia_enviada = fecha || null;
      }

      var result = await window.db
        .from('cobros')
        .update(updates)
        .eq('id', id);

      if (result.error) {
        alert('Error al guardar: ' + result.error.message);
        return;
      }

      // Actualizar array local
      for (var i = 0; i < todosLosDatos.length; i++) {
        if (todosLosDatos[i].id === id) {
          for (var key in updates) {
            todosLosDatos[i][key] = updates[key];
          }
          break;
        }
      }

      aplicarFiltros();
    }

    function cancelarEdicion() {
      aplicarFiltros();
    }

    async function eliminarRegistro(id) {
      if (!confirm('Estas seguro de que quieres eliminar este registro?')) return;

      var result = await window.db.from('cobros').delete().eq('id', id);

      if (result.error) {
        alert('Error al eliminar: ' + result.error.message);
      } else {
        todosLosDatos = todosLosDatos.filter(c => c.id !== id);
        document.getElementById('total-registros').innerText = 'Total: ' + todosLosDatos.length + ' registros';
        aplicarFiltros();
      }
    }

    function exportarCSV() {
      if (datosFiltrados.length === 0) { alert('No hay datos para exportar.'); return; }

      var headers = ['tipo', 'recibo_vision_fecha', 'recibo_fecha_pago_arg', 'monto_pesos', 'transferencia_fecha', 'monto_euros', 'cotizacion_banco_euro', 'banco_detalle', 'obs', 'supervivencia_enviada', 'supervivencia_recibida'];
      
      var csv = headers.join(',') + '\n';
      
      datosFiltrados.forEach(c => {
        var esSupervivencia = c.banco_detalle && c.banco_detalle.toLowerCase().includes('supervivencia');
        var fila = [
          esSupervivencia ? 'Supervivencia' : 'Sueldo',
          c.recibo_vision_fecha || '',
          c.recibo_fecha_pago_arg || '',
          c.monto_pesos || '',
          c.transferencia_fecha || '',
          c.monto_euros || '',
          c.cotizacion_banco_euro || '',
          c.banco_detalle || '',
          c.obs || '',
          c.supervivencia_enviada || '',
          c.supervivencia_recibida || ''
        ].map(v => {
          var valor = String(v);
          if (valor.indexOf(',') !== -1 || valor.indexOf('"') !== -1 || valor.indexOf('\n') !== -1) {
            return '"' + valor.replace(/"/g, '""') + '"';
          }
          return valor;
        });
        csv += fila.join(',') + '\n';
      });

      descargarArchivo(csv, 'IPS_Historial_' + new Date().toISOString().slice(0,10) + '.csv', 'text/csv;charset=utf-8;');
    }

    function exportarJSON() {
      if (datosFiltrados.length === 0) { alert('No hay datos para exportar.'); return; }
      var json = JSON.stringify(datosFiltrados, null, 2);
      descargarArchivo(json, 'IPS_Historial_' + new Date().toISOString().slice(0,10) + '.json', 'application/json');
    }

    function descargarArchivo(contenido, nombre, tipo) {
      var blob = new Blob([contenido], { type: tipo });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
