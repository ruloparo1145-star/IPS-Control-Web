<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Graficos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js para los graficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .bg-ips { background-color: #50B9C0 !important; }
    .btn-ips { background-color: #50B9C0; border-color: #50B9C0; color: white; }
    .btn-ips:hover { background-color: #3da8af; border-color: #3da8af; color: white; }
    .chart-container { position: relative; height: 350px; margin-bottom: 30px; }
  </style>
</head>
<body class="bg-light">
  
  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1 text-white text-decoration-none">Volver al Panel</a>
    </div>
  </nav>

  <div class="container">
    
    <!-- Filtro de ano -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small mb-1">Filtrar por ano</label>
            <select id="filtro-anio-grafico" class="form-select" onchange="renderizarGraficos()">
              <option value="todos">Todos los anos</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Grafico 1: Euros -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white">
        <h5 class="mb-0">Evolucion del Monto en Euros</h5>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <canvas id="grafico-euros"></canvas>
        </div>
      </div>
    </div>

    <!-- Grafico 2: Pesos -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white">
        <h5 class="mb-0">Evolucion del Monto en Pesos</h5>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <canvas id="grafico-pesos"></canvas>
        </div>
      </div>
    </div>

    <!-- Grafico 3: Cotizacion -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white">
        <h5 class="mb-0">Evolucion de la Cotizacion del Euro</h5>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <canvas id="grafico-cotizacion"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let todosLosDatos = [];
    let graficoEuros = null;
    let graficoPesos = null;
    let graficoCotizacion = null;

    document.addEventListener('DOMContentLoaded', async () => {
      let intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          alert('Error: No se pudo conectar a la base de datos.');
          return;
        }
      }

      const session = await verificarSesion();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      await cargarDatos();
    });

    async function cargarDatos() {
      try {
        const { data, error } = await window.db
          .from('cobros')
          .select('*')
          .not('monto_euros', 'is', null)
          .order('recibo_vision_fecha', { ascending: true });

        if (error) throw error;

        // Filtrar registros que NO sean de supervivencia (que tengan monto real)
        todosLosDatos = (data || []).filter(c => c.monto_pesos > 0);

        // Llenar filtro de anos
        const anios = [...new Set(todosLosDatos.map(c => c.recibo_vision_fecha ? c.recibo_vision_fecha.substring(0, 4) : ''))].filter(a => a).sort().reverse();
        const sel = document.getElementById('filtro-anio-grafico');
        anios.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          sel.appendChild(opt);
        });

        renderizarGraficos();

      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function renderizarGraficos() {
      const anioSeleccionado = document.getElementById('filtro-anio-grafico').value;
      
      let datosFiltrados = todosLosDatos;
      if (anioSeleccionado !== 'todos') {
        datosFiltrados = todosLosDatos.filter(c => c.recibo_vision_fecha && c.recibo_vision_fecha.startsWith(anioSeleccionado));
      }

      const etiquetas = datosFiltrados.map(c => {
        const fecha = new Date(c.recibo_vision_fecha);
        return fecha.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' });
      });

      const datosEuros = datosFiltrados.map(c => parseFloat(c.monto_euros) || 0);
      const datosPesos = datosFiltrados.map(c => parseFloat(c.monto_pesos) || 0);
      const datosCotizacion = datosFiltrados.map(c => {
        // Si tenemos cotizacion_banco_euro la usamos, sino calculamos
        if (c.cotizacion_banco_euro) return parseFloat(c.cotizacion_banco_euro);
        if (c.monto_euros && c.monto_pesos) return parseFloat(c.monto_pesos) / parseFloat(c.monto_euros);
        return 0;
      });

      // Destruir graficos anteriores
      if (graficoEuros) graficoEuros.destroy();
      if (graficoPesos) graficoPesos.destroy();
      if (graficoCotizacion) graficoCotizacion.destroy();

      // Grafico de Euros
      graficoEuros = new Chart(document.getElementById('grafico-euros'), {
        type: 'line',
        data: {
          labels: etiquetas,
          datasets: [{
            label: 'Monto en Euros',
            data: datosEuros,
            borderColor: '#50B9C0',
            backgroundColor: 'rgba(80, 185, 192, 0.1)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            pointBackgroundColor: '#50B9C0',
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => `EUR ${context.parsed.y.toLocaleString('es-ES')}`
              }
            }
          },
          scales: {
            y: { beginAtZero: false }
          }
        }
      });

      // Grafico de Pesos
      graficoPesos = new Chart(document.getElementById('grafico-pesos'), {
        type: 'line',
        data: {
          labels: etiquetas,
          datasets: [{
            label: 'Monto en Pesos',
            data: datosPesos,
            borderColor: '#0d6efd',
            backgroundColor: 'rgba(13, 110, 253, 0.1)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            pointBackgroundColor: '#0d6efd',
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => `$${context.parsed.y.toLocaleString('es-AR')}`
              }
            }
          },
          scales: {
            y: { beginAtZero: false }
          }
        }
      });

      // Grafico de Cotizacion
      graficoCotizacion = new Chart(document.getElementById('grafico-cotizacion'), {
        type: 'line',
        data: {
          labels: etiquetas,
          datasets: [{
            label: 'Cotizacion EUR',
            data: datosCotizacion,
            borderColor: '#ffc107',
            backgroundColor: 'rgba(255, 193, 7, 0.1)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            pointBackgroundColor: '#ffc107',
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => `$${context.parsed.y.toLocaleString('es-AR')} por EUR`
              }
            }
          },
          scales: {
            y: { beginAtZero: false }
          }
        }
      });
    }
  </script>
</body>
</html>
