<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Ingreso Mensual</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #E8F4F5 !important; }
    .bg-ips { background-color: #50B9C0 !important; }
    .btn-ips { background-color: #50B9C0; border-color: #50B9C0; color: white; }
    .btn-ips:hover { background-color: #3da8af; border-color: #3da8af; color: white; }
    .card { background-color: #ffffff; }
    .resultado-editable {
      border: 2px dashed #28a745 !important;
      background-color: #f8fff9 !important;
    }
    #info-cotizacion { font-size: 0.85rem; }
    .moneda-btn { font-weight: 600; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1 text-white text-decoration-none">Volver al Panel</a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h4 class="mb-0">Calculo de Ingreso Mensual</h4>
          </div>
          <div class="card-body">

            <!-- Selector de moneda -->
            <div class="card bg-light mb-3">
              <div class="card-body">
                <label class="form-label"><strong>Moneda de destino</strong></label>
                <div class="row g-2">
                  <div class="col-md-3">
                    <input type="radio" class="btn-check" name="moneda" id="mon_eur" value="EUR" checked onchange="cambiarMoneda()">
                    <label class="btn btn-outline-primary w-100 moneda-btn" for="mon_eur">EUR</label>
                  </div>
                  <div class="col-md-3">
                    <input type="radio" class="btn-check" name="moneda" id="mon_usd" value="USD" onchange="cambiarMoneda()">
                    <label class="btn btn-outline-success w-100 moneda-btn" for="mon_usd">USD</label>
                  </div>
                  <div class="col-md-3">
                    <input type="radio" class="btn-check" name="moneda" id="mon_brl" value="BRL" onchange="cambiarMoneda()">
                    <label class="btn btn-outline-warning w-100 moneda-btn" for="mon_brl">BRL</label>
                  </div>
                  <div class="col-md-3">
                    <input type="radio" class="btn-check" name="moneda" id="mon_cny" value="CNY" onchange="cambiarMoneda()">
                    <label class="btn btn-outline-danger w-100 moneda-btn" for="mon_cny">CNY</label>
                  </div>
                </div>
                <small class="text-muted d-block mt-2" id="moneda-ayuda">Euro - Union Europea</small>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Monto en Pesos (ARS)</label>
                <input type="number" step="0.01" id="monto_pesos" class="form-control" required placeholder="Ej: 1274064.93">
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha del Recibo IPS</label>
                <input type="date" id="fecha_recibo" class="form-control" required>
              </div>
            </div>

            <div class="card bg-light mb-3">
              <div class="card-body">
                <label class="form-label"><strong>Cotizacion del <span id="label-moneda">Euro Oficial</span></strong></label>
                <div class="row g-2 mb-2">
                  <div class="col-12">
                    <input type="number" step="0.01" id="cotizacion" class="form-control form-control-lg" required placeholder="Ingresa o trae la cotizacion">
                  </div>
                </div>
                <div class="row g-2">
                  <div class="col-md-12">
                    <button type="button" class="btn btn-outline-primary w-100" onclick="traerCotizacion()">
                      Traer Cotizacion Oficial
                    </button>
                  </div>
                </div>
                <div id="info-cotizacion" class="mt-2"></div>
              </div>
            </div>

            <div class="card bg-light mb-3">
              <div class="card-body">
                <h6 class="text-muted mb-3">Comisiones Fijas (en <span id="label-moneda-com">Euros</span>)</h6>
                <div class="row mb-2">
                  <div class="col-md-6">
                    <label class="form-label small">Banco Provincia de Bs As</label>
                    <input type="number" step="0.01" id="comision_arg" class="form-control" value="20">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small">Banco de Italia</label>
                    <input type="number" step="0.01" id="comision_ita" class="form-control" value="15">
                  </div>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="usar_comisiones" checked>
                  <label class="form-check-label small" for="usar_comisiones">
                    Descontar comisiones fijas
                  </label>
                </div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Fecha Estimada de Cobro</label>
                <input type="date" id="fecha_transferencia" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Observaciones (opcional)</label>
                <input type="text" id="obs" class="form-control" placeholder="Ej: Aguinaldo + Sueldo">
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="button" class="btn btn-ips btn-lg" onclick="calcular()">Calcular</button>
            </div>
          </div>

          <div id="resultados" class="mt-4" style="display:none;">
            <hr>
            <h5 class="text-center mb-3">Resultados</h5>

            <div class="row text-center mb-3">
              <div class="col-md-4">
                <div class="card bg-light">
                  <div class="card-body">
                    <h6 class="text-muted mb-1">Total Bruto</h6>
                    <h4 id="res-bruto" class="text-secondary mb-0">--</h4>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card bg-light">
                  <div class="card-body">
                    <h6 class="text-muted mb-1">Total Comisiones</h6>
                    <h4 id="res-comision" class="text-danger mb-0">--</h4>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card border-success">
                  <div class="card-body">
                    <h6 class="text-muted mb-1">NETO FINAL (editable)</h6>
                    <input type="number" step="0.01" id="res-neto-editable" class="form-control form-control-lg text-center text-success fw-bold resultado-editable">
                  </div>
                </div>
              </div>
            </div>

            <div class="d-grid mt-3">
              <button class="btn btn-success btn-lg" onclick="guardarCobro()">Guardar en Base de Datos</button>
            </div>
            <div id="mensaje-guardado" class="text-center mt-2"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    var datosCalculados = null;
    var monedaActual = 'EUR';

    // Configuracion por moneda
    var MONEDAS = {
      EUR: { nombre: 'Euro', plural: 'Euros', endpoint: 'eur', descripcion: 'Euro - Union Europea' },
      USD: { nombre: 'Dolar', plural: 'Dolares', endpoint: 'usd', descripcion: 'Dolar - Estados Unidos' },
      BRL: { nombre: 'Real', plural: 'Reales', endpoint: 'brl', descripcion: 'Real - Brasil' },
      CNY: { nombre: 'Yuan', plural: 'Yuanes', endpoint: 'cny', descripcion: 'Yuan - China' }
    };

    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('fecha_recibo').value = new Date().toISOString().split('T')[0];

      var intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(function(r) { setTimeout(r, 200); });
        intentos++;
        if (intentos > 20) return;
      }
      var session = await verificarSesion();
      if (!session) window.location.href = 'login.html';

      var comArg = localStorage.getItem('ips_comision_arg');
      var comIta = localStorage.getItem('ips_comision_ita');
      if (comArg) document.getElementById('comision_arg').value = comArg;
      if (comIta) document.getElementById('comision_ita').value = comIta;
    });

    function cambiarMoneda() {
      var radio = document.querySelector('input[name="moneda"]:checked');
      monedaActual = radio.value;
      var info = MONEDAS[monedaActual];

      document.getElementById('label-moneda').innerText = info.nombre + ' Oficial';
      document.getElementById('label-moneda-com').innerText = info.plural;
      document.getElementById('moneda-ayuda').innerText = info.descripcion;

      // Limpiar cotizacion al cambiar de moneda
      document.getElementById('cotizacion').value = '';
      document.getElementById('info-cotizacion').innerHTML = '';
      document.getElementById('resultados').style.display = 'none';
    }

    function guardarComisiones() {
      localStorage.setItem('ips_comision_arg', document.getElementById('comision_arg').value);
      localStorage.setItem('ips_comision_ita', document.getElementById('comision_ita').value);
    }

    // ==== TRAER COTIZACION ====
    async function traerCotizacion() {
      var btn = event.target;
      var textoOriginal = btn.innerText;
      btn.innerText = 'Buscando...';
      btn.disabled = true;
      var info = document.getElementById('info-cotizacion');
      var moneda = MONEDAS[monedaActual];
      info.innerHTML = '<span class="text-muted">Conectando con dolarapi.com...</span>';

      try {
        // DolarAPI tiene endpoints para eur, brl, cny
        // Para USD se usa otro endpoint
        var url;
        if (monedaActual === 'USD') {
          url = 'https://dolarapi.com/v1/dolares/oficial';
        } else {
          url = 'https://dolarapi.com/v1/cotizaciones/' + moneda.endpoint;
        }

        console.log('Consultando:', url);
        var res = await fetch(url);
        console.log('Respuesta status:', res.status);

        if (!res.ok) {
          throw new Error('El servidor respondio con error ' + res.status);
        }

        var data = await res.json();
        console.log('Datos recibidos:', data);

        // Extraer el valor de venta
        var valorVenta = null;
        var dataObj = Array.isArray(data) ? data[0] : data;

        if (dataObj) {
          if (dataObj.venta) {
            valorVenta = dataObj.venta;
          } else if (dataObj.compra) {
            valorVenta = dataObj.compra;
          }
        }

        if (valorVenta) {
          document.getElementById('cotizacion').value = valorVenta;
          info.innerHTML = '<span class="text-success">' + moneda.nombre + ' Oficial: $' + valorVenta + ' | ' + new Date().toLocaleString('es-AR') + '</span>';
        } else {
          info.innerHTML = '<span class="text-danger">No se encontro el valor para ' + moneda.nombre + '. Ingresalo a mano.</span>';
        }

      } catch (e) {
        console.error('Error al traer cotizacion:', e);
        info.innerHTML = '<span class="text-danger">Error al conectar: ' + e.message + '. Ingresa la cotizacion a mano.</span>';
      }

      btn.innerText = textoOriginal;
      btn.disabled = false;
    }

    function calcular() {
      var pesos = parseFloat(document.getElementById('monto_pesos').value);
      var cotizacion = parseFloat(document.getElementById('cotizacion').value);
      var comArg = parseFloat(document.getElementById('comision_arg').value) || 0;
      var comIta = parseFloat(document.getElementById('comision_ita').value) || 0;
      var usarComisiones = document.getElementById('usar_comisiones').checked;

      if (!pesos || !cotizacion) {
        alert('Por favor, completa el monto en pesos y la cotizacion.');
        return;
      }

      guardarComisiones();

      var bruto = pesos / cotizacion;
      var totalComisiones = usarComisiones ? (comArg + comIta) : 0;
      var neto = bruto - totalComisiones;

      document.getElementById('res-bruto').innerText = monedaActual + ' ' + bruto.toFixed(2);
      document.getElementById('res-comision').innerText = '- ' + monedaActual + ' ' + totalComisiones.toFixed(2);
      document.getElementById('res-neto-editable').value = neto.toFixed(2);
      document.getElementById('resultados').style.display = 'block';

      datosCalculados = {
        pesos: pesos,
        cotizacion: cotizacion,
        comArg: comArg,
        comIta: comIta,
        totalComisiones: totalComisiones,
        bruto: bruto,
        neto: neto,
        moneda: monedaActual
      };
    }

    async function guardarCobro() {
      if (!datosCalculados) return;
      var session = await verificarSesion();
      if (!session) return;

      var netoReal = parseFloat(document.getElementById('res-neto-editable').value);
      if (!netoReal) { alert('El campo NETO no puede estar vacio.'); return; }

      var msg = document.getElementById('mensaje-guardado');
      msg.innerText = 'Guardando...';

      var obsUsuario = document.getElementById('obs').value || '';
      var obsComision = 'Com.Arg: ' + datosCalculados.moneda + datosCalculados.comArg + ' + Com.Ita: ' + datosCalculados.moneda + datosCalculados.comIta;
      var obsFinal = obsUsuario ? (obsUsuario + ' | ' + obsComision) : obsComision;

      var result = await window.db.from('cobros').insert([{
        user_id: session.user.id,
        recibo_vision_fecha: document.getElementById('fecha_recibo').value,
        recibo_fecha_pago_arg: document.getElementById('fecha_recibo').value,
        monto_pesos: datosCalculados.pesos,
        transferencia_fecha: document.getElementById('transferencia_fecha').value || null,
        monto_euros: netoReal,
        cotizacion_banco_euro: datosCalculados.cotizacion,
        cotizacion_calculada_euro: datosCalculados.cotizacion,
        banco_detalle: 'Banco 1140 - Pago Ext.',
        obs: obsFinal
      }]);

      if (result.error) {
        msg.innerHTML = '<span class="text-danger">Error: ' + result.error.message + '</span>';
      } else {
        msg.innerHTML = '<span class="text-success">Guardado con exito! Redirigiendo...</span>';
        setTimeout(function() { window.location.href = 'index.html'; }, 1500);
      }
    }
  </script>
</body>
</html>
