<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Supervivencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #E8F4F5 !important; }
    .bg-ips { background-color: #50B9C0 !important; }
    .btn-ips { background-color: #50B9C0; border-color: #50B9C0; color: white; }
    .btn-ips:hover { background-color: #3da8af; border-color: #3da8af; color: white; }
    .semaforo { font-size: 3rem; line-height: 1; font-weight: bold; }
    .card { background-color: #ffffff; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1 text-white text-decoration-none">Volver al Panel</a>
    </div>
  </nav>

  <div class="container">

    <div id="panel-estado" class="card shadow-sm mb-4">
      <div class="card-body text-center py-4">
        <div id="semaforo-icono" class="semaforo mb-2">...</div>
        <h3 id="estado-titulo">Calculando...</h3>
        <p class="text-muted mb-0" id="estado-detalle"></p>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-md-6">
        <button class="btn btn-ips btn-lg w-100" data-bs-toggle="collapse" data-bs-target="#formSupervivencia">
          Registrar Nuevo Tramite
        </button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary btn-lg w-100" onclick="activarNotificaciones()">
          Activar Notificaciones
        </button>
      </div>
    </div>

    <div class="collapse mb-4" id="formSupervivencia">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h5 class="mb-0">Nuevo Tramite de Supervivencia</h5>
        </div>
        <div class="card-body">
          <form id="form-supervivencia">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Fecha de Envio del Certificado</label>
                <input type="date" id="fecha_envio" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha de Recepcion (opcional)</label>
                <input type="date" id="fecha_recepcion" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Observaciones (opcional)</label>
              <input type="text" id="obs_supervivencia" class="form-control" placeholder="Ej: Enviado por correo certificado">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">Guardar Tramite</button>
            </div>
          </form>
          <div id="mensaje-guardado-sup" class="text-center mt-3"></div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Historial de Tramites</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead class="table-dark">
              <tr>
                <th>Tipo</th>
                <th>Envio</th>
                <th>Recepcion</th>
                <th>Demora</th>
                <th>Obs</th>
                <th>Proximo</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-supervivencia">
              <tr><td colspan="7" class="text-center">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // ==== VARIABLES GLOBALES ====
    var todosLosTramites = [];

    // ==== FUNCION PARA OBTENER ELEMENTOS CON LOG ====
    function getEl(id) {
      var el = document.getElementById(id);
      if (!el) {
        console.error('ELEMENTO NO ENCONTRADO: #' + id);
      }
      return el;
    }

    // ==== INICIALIZACION ====
    function iniciarApp() {
      console.log('=== INICIANDO APP ===');

      // Esperar a que window.db este listo
      var checkDb = setInterval(async function() {
        if (typeof window.db !== 'undefined') {
          clearInterval(checkDb);
          console.log('window.db esta listo');
          await ejecutarLogica();
        }
      }, 200);

      // Timeout de seguridad
      setTimeout(function() {
        clearInterval(checkDb);
        if (typeof window.db === 'undefined') {
          console.error('TIMEOUT: window.db nunca se definio');
          var titulo = getEl('estado-titulo');
          if (titulo) titulo.innerText = 'Error: No se pudo conectar.';
        }
      }, 5000);
    }

    async function ejecutarLogica() {
      console.log('Verificando sesion...');
      var session = await verificarSesion();
      if (!session) {
        console.log('Sin sesion, redirigiendo a login');
        window.location.href = 'login.html';
        return;
      }
      console.log('Sesion OK:', session.user.email);

      // Poner fecha de hoy
      var inputFecha = getEl('fecha_envio');
      if (inputFecha) inputFecha.value = new Date().toISOString().split('T')[0];

      console.log('Cargando tramites...');
      await cargarTramites();

      console.log('Configurando formulario...');
      configurarFormulario();
    }

    // ==== CARGAR DATOS ====
    async function cargarTramites() {
      console.log('=== CARGAR TRAMITES ===');
      try {
        var result = await window.db
          .from('cobros')
          .select('*')
          .ilike('banco_detalle', '%supervivencia%')
          .order('supervivencia_enviada', { ascending: false });

        if (result.error) {
          console.error('Error de Supabase:', result.error);
          throw result.error;
        }

        console.log('Tramites recibidos:', result.data ? result.data.length : 0);
        todosLosTramites = result.data || [];

        console.log('Renderizando tabla...');
        renderizarTabla();

        console.log('Actualizando semaforo...');
        actualizarSemaforo();

        console.log('=== TODO OK ===');

      } catch (error) {
        console.error('ERROR en cargarTramites:', error);
        var tbody = getEl('tabla-supervivencia');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error: ' + error.message + '</td></tr>';
        }
      }
    }

    function renderizarTabla() {
      console.log('Renderizando tabla con', todosLosTramites.length, 'tramites');
      var tbody = getEl('tabla-supervivencia');
      if (!tbody) {
        console.error('NO EXISTE el tbody #tabla-supervivencia');
        return;
      }

      if (todosLosTramites.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay tramites registrados.</td></tr>';
        return;
      }

      var html = '';
      for (var i = 0; i < todosLosTramites.length; i++) {
        var t = todosLosTramites[i];
        var demora = '-';
        if (t.supervivencia_enviada && t.supervivencia_recibida) {
          var dias = Math.round((new Date(t.supervivencia_recibida) - new Date(t.supervivencia_enviada)) / (1000 * 60 * 60 * 24));
          demora = dias + ' dias';
        }
        var proximo = '-';
        if (t.supervivencia_enviada) {
          var fecha = new Date(t.supervivencia_enviada);
          fecha.setMonth(fecha.getMonth() + 5);
          proximo = fecha.toLocaleDateString('es-ES');
        }
        html += '<tr>';
        html += '<td><span class="badge bg-warning text-dark">Supervivencia</span></td>';
        html += '<td>' + (t.supervivencia_enviada || '-') + '</td>';
        html += '<td>' + (t.supervivencia_recibida || 'Pendiente') + '</td>';
        html += '<td>' + demora + '</td>';
        html += '<td><small>' + (t.obs || '-') + '</small></td>';
        html += '<td>' + proximo + '</td>';
        html += '<td class="text-center"><button class="btn btn-sm btn-outline-danger" onclick="eliminarTramite(' + t.id + ')">X</button></td>';
        html += '</tr>';
      }
      tbody.innerHTML = html;
      console.log('Tabla renderizada');
    }

    function actualizarSemaforo() {
      console.log('=== ACTUALIZANDO SEMAFORO ===');
      var icono = getEl('semaforo-icono');
      var titulo = getEl('estado-titulo');
      var detalle = getEl('estado-detalle');
      var panel = getEl('panel-estado');

      console.log('Elementos encontrados:');
      console.log('- icono:', icono ? 'OK' : 'NULL');
      console.log('- titulo:', titulo ? 'OK' : 'NULL');
      console.log('- detalle:', detalle ? 'OK' : 'NULL');
      console.log('- panel:', panel ? 'OK' : 'NULL');

      if (!icono || !titulo || !detalle || !panel) {
        console.error('Faltan elementos del semaforo. NO se puede continuar.');
        return;
      }

      if (todosLosTramites.length === 0) {
        icono.innerText = 'ALERTA';
        titulo.innerText = 'Sin registro de supervivencia';
        detalle.innerText = 'Registra el primer tramite.';
        panel.className = 'card shadow-sm mb-4 bg-warning text-dark';
        return;
      }

      var ultimo = todosLosTramites[0];
      var fechaUltimo = new Date(ultimo.supervivencia_enviada);
      var proximo = new Date(fechaUltimo);
      proximo.setMonth(proximo.getMonth() + 5);

      var hoy = new Date();
      var diffDias = Math.round((proximo - hoy) / (1000 * 60 * 60 * 24));

      detalle.innerText = 'Proximo tramite: ' + proximo.toLocaleDateString('es-ES') + ' (en ' + diffDias + ' dias)';

      if (diffDias < 0) {
        icono.innerText = 'VENCIDO';
        titulo.innerText = 'URGENTE! Tramite vencido';
        panel.className = 'card shadow-sm mb-4 bg-danger text-white';
      } else if (diffDias <= 30) {
        icono.innerText = 'URGENTE';
        titulo.innerText = 'Quedan menos de 30 dias';
        panel.className = 'card shadow-sm mb-4 bg-danger text-white';
      } else if (diffDias <= 60) {
        icono.innerText = 'ATENCION';
        titulo.innerText = 'Quedan menos de 60 dias';
        panel.className = 'card shadow-sm mb-4 bg-warning text-dark';
      } else {
        icono.innerText = 'OK';
        titulo.innerText = 'Todo en orden';
        panel.className = 'card shadow-sm mb-4 bg-success text-white';
      }
      console.log('Semaforo actualizado');
    }

    function configurarFormulario() {
      var form = getEl('form-supervivencia');
      if (!form) {
        console.error('No existe el formulario #form-supervivencia');
        return;
      }
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var msg = getEl('mensaje-guardado-sup');
        if (msg) msg.innerText = 'Guardando...';

        var session = await verificarSesion();
        if (!session) return;

        var fechaEnvio = getEl('fecha_envio').value;
        var fechaRecepcionInput = getEl('fecha_recepcion');
        var fechaRecepcion = fechaRecepcionInput ? (fechaRecepcionInput.value || null) : null;
        var obsInput = getEl('obs_supervivencia');
        var obs = obsInput ? (obsInput.value || 'Pedido Supervivencia') : 'Pedido Supervivencia';

        var proxima = new Date(fechaEnvio);
        proxima.setMonth(proxima.getMonth() + 5);

        var result = await window.db.from('cobros').insert([{
          user_id: session.user.id,
          recibo_vision_fecha: fechaEnvio,
          recibo_fecha_pago_arg: fechaEnvio,
          monto_pesos: 0,
          monto_euros: 0,
          banco_detalle: 'Tramite Supervivencia',
          obs: obs,
          supervivencia_enviada: fechaEnvio,
          supervivencia_recibida: fechaRecepcion,
          proxima_supervivencia: proxima.toISOString().split('T')[0]
        }]);

        if (result.error) {
          if (msg) msg.innerHTML = '<span class="text-danger">Error: ' + result.error.message + '</span>';
        } else {
          if (msg) msg.innerHTML = '<span class="text-success">Guardado!</span>';
          form.reset();
          getEl('fecha_envio').value = new Date().toISOString().split('T')[0];
          await cargarTramites();
        }
      });
    }

    async function eliminarTramite(id) {
      if (!confirm('Eliminar este tramite?')) return;
      var result = await window.db.from('cobros').delete().eq('id', id);
      if (result.error) {
        alert('Error: ' + result.error.message);
      } else {
        await cargarTramites();
      }
    }

    // ==== NOTIFICACIONES ====
    async function pedirPermisoNotificaciones() {
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;
      var permiso = await Notification.requestPermission();
      return permiso === 'granted';
    }

    async function enviarNotificacion(titulo, cuerpo, tag) {
      var permiso = await pedirPermisoNotificaciones();
      if (!permiso) return;
      if (!navigator.serviceWorker.controller) return;
      navigator.serviceWorker.controller.postMessage({
        type: 'MOSTRAR_NOTIFICACION',
        titulo: titulo,
        cuerpo: cuerpo,
        tag: tag
      });
    }

    async function activarNotificaciones() {
      var permiso = await pedirPermisoNotificaciones();
      if (permiso) {
        await enviarNotificacion('Notificaciones activadas', 'Te avisaremos cuando se acerque el tramite.', 'bienvenida');
        alert('Notificaciones activadas!');
      } else {
        alert('No se pudieron activar. Revisa los permisos.');
      }
    }

    // ==== INICIAR ====
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciarApp);
    } else {
      iniciarApp();
    }
  </script>
</body>
</html>
