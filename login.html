<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Iniciar Sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#50B9C0">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">IPS Control</h3>
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required value="raul@ipscontrol.com">
              </div>
              <div class="mb-3">
                <label class="form-label">Contrasena</label>
                <input type="password" id="password" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div id="mensaje-error" class="text-danger text-center mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('mensaje-error');
      errorDiv.innerText = 'Entrando...';

      // Esperar a que la BD estÃ© lista
      let intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          errorDiv.innerText = 'Error: La conexion no esta lista. Recarga la pagina.';
          return;
        }
      }

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await iniciarSesion(email, password);

      if (error) {
        errorDiv.innerText = 'Error: ' + error.message;
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
  <script>
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado'))
          .catch(err => console.log('Error SW:', err));
      });
    }
  </script>
</body>
</body>
</html>
